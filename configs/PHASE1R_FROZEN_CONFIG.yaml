    path: results/phase1R/REIMPLEMENTED_ID_PRESERVING_ARM/cell_index.tsv
    sha256: df812659984b954cb4c6896a7e57d7d817a0edf09111bd7d4cc9bb18083d8226
  source_timepoints: [2, 4, 6]
  source_timepoint_counts: {2: 28249, 4: 48498, 6: 54140}
