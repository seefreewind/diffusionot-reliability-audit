  repository: https://github.com/scDiffEq/LARRY-dataset
  repository_commit: 3966ea5ee85057a4bb9b19e6f2e21d95ee5304be
  public_documentation: https://github.com/scDiffEq/LARRY-dataset
  expected_dimensions_cells_genes: [130887, 25289]
  files:
    expression:
      path: data/model_visible/phase1r_source/stateFate_inVitro_normed_counts.mtx.gz
      layer: normed_counts
