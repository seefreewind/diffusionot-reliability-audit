    gene_names:
      path: data/model_visible/phase1r_source/stateFate_inVitro_gene_names.txt.gz
      sha256: 5672e137bcac196851b8dc44311b40fe61c428d6fd726dfae320b3fe5ddfffcd
  row_order: source metadata and expression-matrix row order; no cell filtering
  cell_id: Library + '|' + Cell barcode
